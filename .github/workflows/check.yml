name: Check passport appointments

# GitHub's scheduler often delays or drops frequent cron runs, so each run checks every
# CHECK_EVERY_MINUTES for about 5.5 hours and then starts the next run itself.
# The hourly cron only restarts the chain if it ever breaks. Free because the repo is public.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Check once and upload screenshot and captured responses"
        type: boolean
        default: false

# Only one run at a time; a run started meanwhile waits for the current one to finish.
concurrency:
  group: checker
  cancel-in-progress: false

permissions:
  actions: write   # to start the next run
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '14' }}
      UNTIL_DATE: ${{ vars.UNTIL_DATE || '2026-11-26' }}
      ALWAYS_NOTIFY: ${{ vars.ALWAYS_NOTIFY || 'false' }}
      CHECK_EVERY_MINUTES: ${{ vars.CHECK_EVERY_MINUTES || '5' }}
      LOOP_MINUTES: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # A hung install fails after 10 minutes; "Start the next run" below still fires and retries.
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
        timeout-minutes: 10

      # state.json remembers which slots were already announced.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check once (debug)
        if: inputs.debug
        run: python checker.py --debug debug

      - name: Check every few minutes
        if: ${{ !inputs.debug }}
        run: |
          end=$((SECONDS + LOOP_MINUTES * 60))
          while [ $SECONDS -lt $end ]; do
            echo "::group::check at $(date -u +%H:%M) UTC"
            python checker.py || echo "check failed, retrying next round"
            echo "::endgroup::"
            sleep $((CHECK_EVERY_MINUTES * 60))
          done

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Start the next run
        if: ${{ !inputs.debug && !cancelled() }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: inputs.debug
        with:
          name: debug
          path: debug/
