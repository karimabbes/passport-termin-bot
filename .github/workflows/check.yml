name: Check passport appointments

on:
  schedule:
    - cron: "2-59/5 * * * *"  # every 5 minutes (GitHub may start runs late); needs a public repo to stay free
  workflow_dispatch:
    inputs:
      debug:
        description: "Upload screenshot and captured responses"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && playwright install --with-deps chromium

      # state.json remembers which slots were already announced.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python checker.py ${{ inputs.debug && '--debug debug' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '14' }}
          UNTIL_DATE: ${{ vars.UNTIL_DATE || '2026-11-26' }}
          ALWAYS_NOTIFY: ${{ vars.ALWAYS_NOTIFY || 'false' }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: inputs.debug
        with:
          name: debug
          path: debug/
